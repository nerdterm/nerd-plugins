name: install.sh

# The install command pipes https://nerdterm.dev/install.sh into sh, and install.sh checks a release only against
# the keys it carries: a replaced script would carry its own. This checks that the served script is byte for byte
# install.sh at nerd's latest release tag; a red run is the alarm. It reads only public data and changes nothing.
# A release is followed by a site build (scripts/publish-binary.sh starts pages), whose end runs this again; a run
# in the minutes between can be red once. GitHub disables a schedule after 60 days without activity, and mails first.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_run:
    workflows: [pages]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: install-sh

jobs:
  compare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pages' cache serves the old file for up to ten minutes after a deploy: two more looks before the alarm.
      - name: the served install.sh is install.sh of nerd's latest release
        run: |
          set -eu
          get() { curl -fsS --proto =https --retry 3 --retry-all-errors --max-time 60 --max-filesize 1000000 "$@"; }
          tag=$(get -o /dev/null -w '%{redirect_url}' https://github.com/nerdterm/nerd/releases/latest)
          tag=${tag##*/}
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "no latest release tag" >&2; exit 1; }
          get -o released.sh "https://raw.githubusercontent.com/nerdterm/nerd/$tag/install.sh"
          want=$(sha256sum released.sh | cut -d' ' -f1)
          for look in 1 2 3; do
            rm -f served.sh
            get -o served.sh https://nerdterm.dev/install.sh || :
            got=$(sha256sum served.sh 2>/dev/null | cut -d' ' -f1)
            [ "$got" = "$want" ] && { echo "nerdterm.dev/install.sh is install.sh of $tag ($got)"; exit 0; }
            [ "$look" = 3 ] || sleep 300
          done
          echo "nerdterm.dev/install.sh (${got:-not fetched}) is not install.sh of $tag ($want)" >&2
          [ -f served.sh ] && { diff released.sh served.sh | head -60 | cut -c1-200 >&2 || :; }
          exit 1
