name: pages

# Builds nerdterm.dev from main and nerd's latest release, and publishes it on GitHub Pages. A push to main, the day's
# run after stars.yml counts the stars (its push, made with GITHUB_TOKEN, starts no workflow) and the maintainer's button
# run it; no pull request builds or deploys anything. The build needs nerd, which is macOS only, so it runs on a
# GitHub-hosted macOS runner and installs nerd's latest release itself; it clones each plugin's repository as data and
# runs none of it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every date on the site comes from this repository's history.
          fetch-depth: 0
          persist-credentials: false
      - name: nerd's latest release, its signature checked against the pinned release keys, installed and checked out
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/dl" && cd "$RUNNER_TEMP/dl"
          tag=$(curl -fsS -o /dev/null -w '%{redirect_url}' https://github.com/nerdterm/nerd/releases/latest)
          tag=${tag##*/}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no latest release of nerd: $tag" >&2; exit 1; }
          bash "$GITHUB_WORKSPACE/.github/nerd-release.sh" "$tag" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          case "$("$RUNNER_TEMP/bin/nerd" --version)" in
            "nerd ${tag#v} "*) ;;
            *) echo "the installed nerd is not $tag" >&2; exit 1 ;;
          esac
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" https://github.com/nerdterm/nerd "$RUNNER_TEMP/nerd"
      - name: build the site
        run: node site/build.mjs "$RUNNER_TEMP/site" --nerd-repo "$RUNNER_TEMP/nerd" --nerd "$(command -v nerd)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
