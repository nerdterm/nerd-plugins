name: pages

# Builds nerdterm.dev from main and nerd's latest release, and publishes it on GitHub Pages. A push to main, the day's
# run after stars.yml counts the stars (its push, made with GITHUB_TOKEN, starts no workflow) and the maintainer's button
# run it; no pull request builds or deploys anything. The build needs nerd, which is macOS only, so it runs on the
# catalog-review runner; it clones each plugin's repository as data and runs none of it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS, catalog-review]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every date on the site comes from this repository's history.
          fetch-depth: 0
          persist-credentials: false
      - name: nerd's latest release, installed and checked out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/nerdterm/nerd/releases/latest --jq .tag_name)
          case "$(nerd --version)" in
            "nerd ${tag#v} "*) ;;
            *) echo "this runner has $(nerd --version), not nerd $tag: install the current release first" >&2; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/nerd" "$RUNNER_TEMP/site"
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" https://github.com/nerdterm/nerd "$RUNNER_TEMP/nerd"
      - name: build the site
        run: node site/build.mjs "$RUNNER_TEMP/site" --nerd-repo "$RUNNER_TEMP/nerd" --nerd "$(command -v nerd)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
