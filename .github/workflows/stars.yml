name: stars

# Counts each plugin's GitHub stars into stars.json, which nerd and the site read. Runs this repository's own
# script on main, never a pull request's, and reads only public data.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: ['plugins/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: stars

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/stars.sh
          git add stars.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stars.json
          git commit -m 'chore: count stars'
          git push
