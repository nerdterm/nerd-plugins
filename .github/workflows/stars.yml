name: stars

# Counts each plugin's GitHub stars into stars.json, which nerd and the site read. Runs this repository's own
# script on main, never a pull request's, and reads only public data.
on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths: ['plugins/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: stars

jobs:
  count:
    # a manual run from another branch would merge that branch with the count
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/stars-${{ github.run_id }}
        # main takes changes only through a pull request: the count goes in as one and merges itself
        run: |
          scripts/stars.sh
          git add stars.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m 'chore: count stars'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'chore: count stars' --body 'Counted by the stars workflow.'
          gh pr merge "$BRANCH" --squash --delete-branch
